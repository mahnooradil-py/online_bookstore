<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Recommendation Finder</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>Book Recommendation Finder</h1>
      <p>Find books based on your preferences</p>
    </header>

    <!-- Book Filter Form -->
    <section id="filterSection">
      <form id="recommendationForm">
        <fieldset>
          <legend>Filter Books</legend>

          <!-- Genre Selection -->
          <label for="genre">Genre:</label>
          <select id="genre">
            <option value="">Select Genre</option>
            <option value="Fiction">Fiction</option>
            <option value="Mystery">Mystery</option>
            <option value="Non-Fiction">Non-Fiction</option>
          </select>

          <!-- Author Name (Optional) -->
          <label for="author">Author Name:</label>
          <input type="text" id="author" placeholder="Enter author's name (Optional)">

          <!-- Price Range Dropdown (Max £100) -->
          <label for="priceRange">Select Price Range (£):</label>
          <select id="priceRange">
            <option value="0-20">£0 - £20</option>
            <option value="20-50">£20 - £50</option>
          </select>

          <!-- Language Selection -->
          <label for="language">Language:</label>
          <select id="language">
            <option value="">Select Language</option>
            <option value="English">English</option>
            <option value="Urdu">Urdu</option>
          </select>

          <!-- Publication Year (Optional) -->
          <label for="pubYear">Publication Year:</label>
          <select id="pubYear">
            <option value="">Any Year</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
          </select>

          <!-- Format Selection -->
          <label for="format">Format:</label>
          <select id="format">
            <option value="">Select Format</option>
            <option value="Hardcover">Hardcover</option>
            <option value="eBook">eBook</option>
          </select>

          <button type="submit">Get Recommendations</button>
        </fieldset>
      </form>
    </section>

    <!-- Book Recommendations & Wishlist Unified Section -->
    <section id="resultsContainer">
      <div class="results">
        <!-- Recommended Books -->
        <div id="recommendations">
          <h3>Recommended Books</h3>
          <div id="bookList"></div>
        </div>

        <!-- Wishlist -->
        <div id="wishlistContainer">
          <h3>Your Wishlist</h3>
          <div id="wishlist"></div>
          <button id="clearWishlist">Clear Wishlist</button>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>

</html>
